name: Test ClassCharts connection

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'

      - name: Test ClassCharts
        env:
          CLASSCHARTS_PUPIL_CODE: ${{ secrets.CLASSCHARTS_PUPIL_CODE }}
          CLASSCHARTS_DOB: ${{ secrets.CLASSCHARTS_DOB }}
        run: |
          python -m classcharts_homework \
            --from "$(date -u +%F)" \
            --to "$(date -u -d '+30 days' +%F)"
